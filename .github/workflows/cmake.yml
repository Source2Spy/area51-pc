name: CMake portability

on:
  push:
  pull_request:

jobs:
  windows-x64:
    name: Windows x64 / MSVC
    runs-on: windows-2022
    env:
      _CL_: '/w'
      A51_BUILD_KEY: ${{ secrets.A51_BUILD_KEY }}
      A51_REQUIRE_BUILD_KEY: 'ON'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure host shader tools
        run: cmake --preset shader-tools

      - name: Prepare shader kit
        run: cmake --build --preset prepare-shaders --parallel 4 -- /p:WarningLevel=0 /clp:ErrorsOnly /nologo

      - name: Configure
        run: cmake --preset windows-msvc-x64 -DA51_REQUIRE_BUILD_KEY=$env:A51_REQUIRE_BUILD_KEY

      - name: Build full Release graph
        run: cmake --build --preset windows-msvc-x64-release --parallel 4 -- /p:WarningLevel=0 /clp:ErrorsOnly /nologo

      - name: Build custom configurations
        shell: pwsh
        run: |
          cmake --build --preset windows-msvc-x64-optdebug --target dfsTool --parallel 4 -- /p:WarningLevel=0 /clp:ErrorsOnly /nologo
          cmake --build --preset windows-msvc-x64-qa --target dfsTool --parallel 4 -- /p:WarningLevel=0 /clp:ErrorsOnly /nologo
          cmake --build --preset windows-msvc-x64-editor-debug --target dfsTool --parallel 4 -- /p:WarningLevel=0 /clp:ErrorsOnly /nologo

      - name: Package runtime
        run: >-
          cmake
          "-DA51_BINARY=build/windows-msvc-x64/Apps/GameApp/Release/A51.exe"
          "-DA51_SHADER_KIT=build/shaders/GameApp/release"
          "-DA51_PACKAGE_DIR=build/packages/windows-x64"
          -P cmake/PackageRuntime.cmake

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: A51-windows-x64-release
          path: build/packages/windows-x64
          if-no-files-found: error

  android-arm64:
    name: Android ARM64 / NDK
    runs-on: ubuntu-24.04
    env:
      CFLAGS: '-w'
      CXXFLAGS: '-w'
      A51_BUILD_KEY: ${{ secrets.A51_BUILD_KEY }}
      A51_REQUIRE_BUILD_KEY: 'ON'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Configure host shader tools
        run: cmake --preset shader-tools

      - name: Prepare shader kit
        run: cmake --build --preset prepare-shaders --parallel 4

      - name: Build Release APK
        working-directory: Apps/GameApp/android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          A51_SIGN_RELEASE: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: |
          if [ "$A51_SIGN_RELEASE" = 'true' ]; then
            if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
              echo '::error::Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets.'
              exit 1
            fi
            export ANDROID_RELEASE_KEYSTORE="$RUNNER_TEMP/area51-release.jks"
            trap 'rm -f "$ANDROID_RELEASE_KEYSTORE"' EXIT
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          fi
          gradle --no-daemon --max-workers=4 --stacktrace -PA51_REQUIRE_BUILD_KEY="$A51_REQUIRE_BUILD_KEY" :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Package runtime
        run: cmake -DA51_BINARY=Apps/GameApp/android/app/build/outputs/apk/release/app-release.apk -DA51_SHADER_KIT=build/shaders/GameApp/release -DA51_PACKAGE_DIR=build/packages/android-arm64 -P cmake/PackageRuntime.cmake

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: A51-android-arm64-release-${{ github.event_name == 'push' && 'signed' || 'test-signed' }}
          path: build/packages/android-arm64
          if-no-files-found: error

  linux-x64:
    name: Linux x64 / GCC
    runs-on: ubuntu-24.04
    env:
      CFLAGS: '-w'
      CXXFLAGS: '-w'
      A51_BUILD_KEY: ${{ secrets.A51_BUILD_KEY }}
      A51_REQUIRE_BUILD_KEY: 'ON'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libfribidi-dev libthai-dev \
            libusb-1.0-0-dev liburing-dev

      - name: Configure host shader tools
        run: cmake --preset shader-tools

      - name: Prepare shader kit
        run: cmake --build --preset prepare-shaders --parallel 4

      - name: Configure
        run: cmake --preset linux-gcc-x64 -DA51_REQUIRE_BUILD_KEY="$A51_REQUIRE_BUILD_KEY"

      - name: Build full Release graph
        run: cmake --build --preset linux-gcc-x64-release --parallel 4 -- -k 0

      - name: Package runtime
        run: cmake -DA51_BINARY=build/linux-gcc-x64/Apps/GameApp/Release/A51 -DA51_SHADER_KIT=build/shaders/GameApp/release -DA51_PACKAGE_DIR=build/packages/linux-x64 -P cmake/PackageRuntime.cmake

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: A51-linux-x64-release
          path: build/packages/linux-x64
          if-no-files-found: error

  nightly-release:
    name: Nightly Release
    needs: [windows-x64, android-arm64, linux-x64]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      actions: read
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/packages
          for NAME in A51-windows-x64-release A51-android-arm64-release-signed A51-linux-x64-release; do
            ID=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$NAME" --jq '.artifacts[] | select(.expired == false) | .id')
            test -n "$ID"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" \
              --output "build/packages/$NAME.zip"
          done

      - name: Publish Nightly Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$LATEST" != "$GITHUB_SHA" ]; then
            exit 0
          fi
          TITLE="Dreamland-51 Automatic Release $(date -u +'%Y%m%d')"
          NOTES='Automatic releases are being uploaded after any new commit.'
          git push origin "+$GITHUB_SHA:refs/tags/nightly"
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly \
              build/packages/A51-windows-x64-release.zip \
              build/packages/A51-android-arm64-release-signed.zip \
              build/packages/A51-linux-x64-release.zip \
              --clobber
            gh release edit nightly --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create nightly \
              build/packages/A51-windows-x64-release.zip \
              build/packages/A51-android-arm64-release-signed.zip \
              build/packages/A51-linux-x64-release.zip \
              --title "$TITLE" --notes "$NOTES" --prerelease --verify-tag
          fi
